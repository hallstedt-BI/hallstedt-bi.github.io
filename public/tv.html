<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>TV · Fredagsdrinken</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍸</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Pinyon+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<main class="tv">
  <section class="tv-left">
    <div id="tv-drink"><p class="week-line lbl">Veckans drink</p><h1 class="drink-name">Laddar…</h1></div>
    <div class="tv-cta">
      <div class="qr" id="tv-qr" aria-label="QR-kod till röstningen"></div>
      <div><p class="say">Rösta på veckans drink här!</p><p class="sub" id="tv-sub">Scanna med kameran i mobilen.</p></div>
    </div>
  </section>
  <section class="tv-right">
    <h2 class="board-title"><span class="script">Topplistan</span><span class="sub lbl">Snittbetyg per drink</span></h2>
    <div id="board"><p class="board-empty">Laddar…</p></div>
    <p class="tv-foot" id="tv-foot"></p>
  </section>
</main>
<script src="assets/qrcode.js"></script>
<script src="assets/common.js"></script>
<script src="assets/tv.js"></script>
</body>
</html>
